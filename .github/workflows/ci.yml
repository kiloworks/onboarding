name: Windows CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.98.1
          components: rustfmt
          target: ${{ matrix.target }}
          cache: false
          rustflags: ''
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-gpui-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: rust-gpui-${{ matrix.arch }}-
      - name: Configure ARM64 Clang
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          $llvm = Join-Path $vs 'VC\Tools\Llvm\ARM64\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'ARM64 Clang is missing' }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check
      - run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package native executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist,artifacts | Out-Null
          Copy-Item target/${{ matrix.target }}/release/onboarding.exe dist/
          python scripts/licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          ./scripts/copy-crt.ps1 -Arch ${{ matrix.arch }}
          $report = @{
            arch = '${{ matrix.arch }}'
            payloadBytes = (Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum
            appBytes = (Get-Item dist/onboarding.exe).Length
            rendererBytes = 0
            licenseBytes = (Get-ChildItem dist/licenses -Recurse -File | Measure-Object Length -Sum).Sum
          }
          $report | ConvertTo-Json | Tee-Object -FilePath artifacts/size.json
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          Invoke-WebRequest -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' -OutFile $archive -MaximumRetryCount 2
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'NSIS archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.13\makensis.exe'
          & $nsis /DARCH=${{ matrix.arch }} packaging/onboarding.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          Get-ChildItem dist/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.arch }}
          path: |
            dist/*-setup.exe*
            artifacts/size.json
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-${{ matrix.arch }}
          path: candidate
      - run: ./scripts/check-windows.ps1
      - run: ./scripts/check-updates.ps1
      - name: Verify updater on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/check-updates.ps1
      - run: ./scripts/prepare-desktop.ps1
      - name: Install, upgrade and exercise native wizard
        shell: pwsh
        run: |
          $installer = Get-ChildItem candidate -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'Onboarding-installed'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          if (!(Test-Path "$install\onboarding.exe") -or (Test-Path "$install\gpuix-native.node")) { throw 'Invalid native payload' }
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KiloworksOnboarding'
          if ((Get-ItemProperty $registry).UninstallString -ne ('"' + $install + '\Uninstall.exe"')) { throw 'Invalid Windows uninstall command' }
          Set-ItemProperty $registry UninstallString ('$"' + $install + '\Uninstall.exe$"')
          'old generated notice' | Set-Content "$install\licenses\old-generated-notice.txt"
          'legacy renderer' | Set-Content "$install\gpuix-native.node"
          'preserve user data' | Set-Content "$install\user-data.txt"
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$install\licenses\old-generated-notice.txt") -or (Test-Path "$install\gpuix-native.node")) { throw 'Upgrade left obsolete runtime files' }
          if (!(Test-Path "$install\user-data.txt") -or !(Test-Path "$install\licenses\LICENSE-INDEX.json")) { throw 'Upgrade lost user data or license index' }
          $env:ONBOARDING_EXE = "$install\onboarding.exe"
          ./scripts/drive-ui.ps1
          ./scripts/check-updates.ps1 -Installer $installer.FullName -InstallDir $install -Arch ${{ matrix.arch }}
          Start-Process "$install\Uninstall.exe" -ArgumentList '/S' -Wait
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onboarding-${{ matrix.runner }}
          path: |
            candidate/
            artifacts/ui-*.png
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: onboarding-*
          path: artifacts
      - name: Collect tested installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          find artifacts/onboarding-windows-2025 -name '*-setup.exe*' -exec cp {} release/ \;
          find artifacts/onboarding-windows-11-arm -name '*-setup.exe*' -exec cp {} release/ \;
      - name: Sign update manifests
        shell: pwsh
        env:
          ONBOARDING_UPDATE_PRIVATE_KEY: ${{ secrets.ONBOARDING_UPDATE_PRIVATE_KEY }}
        run: ./scripts/sign-updates.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat > notes.txt <<NOTES
          Rust GPUI 네이티브 Windows x64·ARM64 미서명 프리뷰입니다. Bun·React·JavaScript 런타임을 포함하지 않습니다.

          | Windows | 설치 파일 | SHA-256 |
          | --- | --- | --- |
          | x64 | [setup.exe]($base/onboarding-$version-windows-x64-setup.exe) | [.sha256]($base/onboarding-$version-windows-x64-setup.exe.sha256) |
          | ARM64 | [setup.exe]($base/onboarding-$version-windows-arm64-setup.exe) | [.sha256]($base/onboarding-$version-windows-arm64-setup.exe.sha256) |

          앱 실행 시 프리릴리스를 포함한 새 버전을 확인합니다. 승인하면 전자서명과 해시를 검증하고 앱을 업데이트한 뒤 다시 실행합니다. 기존 자동 업데이트 미지원 버전에서는 이번 버전을 수동 설치해야 합니다.
          앱 업데이트는 Tailscale·SSH 설정을 유지합니다. 별도의 온보딩 재시작을 승인하면 기존 Tailscale 상태·저장 계정·캐시를 삭제하고 입력한 새 authkey로 등록합니다. 완료한 호스트도 강제로 다시 시작할 수 있습니다.
          시작 화면에서 호스트·Tailnet·IP·SSH 서비스 상태를 확인하고 관리자용 리포트를 복사할 수 있습니다.

          Tailscale 최신 버전과 SSH를 준비하고 모든 네트워크의 TCP 22를 허용합니다. 기본 관리자 공개키 두 개를 등록합니다.
          실제 Windows 10/11 x64와 물리 보안키 원격 접속은 별도 검증이 필요합니다. OIDC 연결 E2E 결과는 해당 실행을 확인하세요.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Onboarding $GITHUB_REF_NAME — Rust GPUI preview" --notes-file notes.txt release/*

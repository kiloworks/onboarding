name: GPUIX ARM64 binding
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: remorses/gpuix
          ref: 515df198fef2685f5ed7dd120bf0db638eb5c360
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ''
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target
          key: gpuix-515df198-arm64-v1
      - name: Configure ARM64 Clang
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          $llvm = Join-Path $vs 'VC\Tools\Llvm\ARM64\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'ARM64 Clang is missing' }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install native build dependencies only
        run: npm install --ignore-scripts --workspaces=false --package-lock=false
        working-directory: packages/native
      - run: bun run build
        working-directory: packages/native
        env:
          CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
      - name: Collect native dependency notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-licenses | Out-Null
          $roots = @((Join-Path $env:USERPROFILE '.cargo/registry/src'), 'zed/crates', 'packages/native')
          foreach ($root in $roots) {
            if (!(Test-Path $root)) { continue }
            Get-ChildItem $root -Recurse -File -Include 'LICENSE*','COPYING*','NOTICE*' | ForEach-Object {
              $parent = Split-Path $_.DirectoryName -Leaf
              $dest = Join-Path 'native-licenses' ($parent + '-' + $_.Name)
              Copy-Item $_.FullName $dest -Force
            }
          }
          if (!(Get-ChildItem native-licenses)) { throw 'No native notices collected' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpuix-native-licenses
          path: native-licenses
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpuix-win32-arm64
          path: packages/native/gpuix-native.win32-arm64-msvc.node
          if-no-files-found: error
          retention-days: 14

name: Update diagnostic
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-x64
          path: candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - run: ./scripts/prepare-desktop.ps1
      - name: Reproduce signed upgrade and restart
        shell: pwsh
        run: |
          $installer = Get-ChildItem candidate -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'Onboarding-installed'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          'preserve user data' | Set-Content "$install/user-data.txt"
          ./scripts/check-updates.ps1 -Installer $installer.FullName -InstallDir $install -Arch x64
          Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -Wait

name: Fast Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.98.1
          components: rustfmt
          cache: false
          rustflags: ''
      - run: cargo fmt --check
      - run: ./scripts/check-windows.ps1
      - run: python -m py_compile scripts/e2e.py scripts/licenses.py

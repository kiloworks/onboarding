name: Fast Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/core.test.ts
      - run: ./scripts/check-windows.ps1
      - run: New-Item -ItemType Directory -Force artifacts | Out-Null
      - run: bun run test:ui
      - run: bun run build

# Temporary narrow repro: no OIDC permissions or real credentials.
name: Native UI diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-x64
          path: candidate
          run-id: 39211935334
          github-token: ${{ github.token }}
      - shell: pwsh
        run: |
          $installer = Get-ChildItem candidate -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'Onboarding-UI-repro'
          $p = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $env:ONBOARDING_EXE = "$dir\onboarding.exe"
          ./scripts/drive-ui.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ui-diagnostic
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 1

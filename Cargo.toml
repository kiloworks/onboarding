[package]
name = "onboarding"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "onboarding"
path = "native/src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2565b8a3e33537c3d3f56d0d45f11e50a17e512d", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2565b8a3e33537c3d3f56d0d45f11e50a17e512d", features = ["font-kit", "x11", "wayland"] }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
regex = "1"
tempfile = "3"
zeroize = "1"
subtle = "2"
unicode-segmentation = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2565b8a3e33537c3d3f56d0d45f11e50a17e512d", features = ["runtime_shaders"] }
